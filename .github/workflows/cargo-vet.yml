# cargo-vet, supply-chain trust auditing
#
# WHY A SEPARATE GATE: cargo-audit/cargo-deny/OSV answer "does this dependency
# have a KNOWN vulnerability?", and all of them wait for an advisory to be
# published. cargo-vet asks a different question: "has anyone read this code?"
# It ties the source to a trustworthy audit record (Mozilla, Google, Bytecode
# Alliance, ISRG, Embark imports). When a dependency is compromised and a
# malicious version is published the advisory appears days or months later;
# the absence of an audit record is visible from the first minute. For a
# transfer core whose parser surface consumes untrusted bytes this gap must
# be closed.
#
# GATE POLICY: the gate is mandatory green from the first run:
# `cargo vet --locked` must pass. First-party crates carry self-audits in
# supply-chain/audits.toml; third-party crates resolve through the imported
# audit sources, the trust entries, or the exemption baseline recorded in
# supply-chain/config.toml at repository bootstrap (2026-09-08). Every new
# dependency must resolve through one of those before it merges.

name: Cargo Vet

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 2" # weekly: the imported audit sources are refreshed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-vet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    name: Cargo Vet (supply-chain trust, mandatory green)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: seed-core

      - name: Install cargo-vet (--locked, fixed version)
        run: |
          set -euo pipefail
          cargo install --locked --version 0.10.2 cargo-vet
          cargo vet --version

      # Vacuous-gate protection: the config must parse and name at least one
      # import source plus the self-audit file; a broken config could make
      # the tool trivially report success.
      - name: Canary - evidence that the gate reads real config
        run: |
          set -euo pipefail
          grep -q '\[imports.mozilla\]' supply-chain/config.toml
          grep -q '\[\[audits.seed-core\]\]' supply-chain/audits.toml
          cargo vet check --locked --output-format human 2>/dev/null | head -5 || true
          echo "config parses and carries imports plus self-audits."

      - name: The gate (every dependency must carry an audit record)
        run: cargo vet --locked

      # Informational: it makes visible in the PR summary which crates carry
      # the audit debt, so paying it down can be targeted.
      - name: Audit debt summary (informational)
        if: always()
        run: |
          {
            echo "### cargo-vet audit debt"
            echo '```'
            cargo vet suggest 2>/dev/null | tail -40 || echo "(suggest could not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

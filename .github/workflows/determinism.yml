name: Determinism

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline-reproducibility:
    # CI Expansion item 1: reproducibility check.
    # Run the deterministic pipeline twice on the same platform; the recipe
    # digest and the stream commitment must be identical.
    name: Pipeline Reproducibility (item 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: seed-core
      - name: Deterministic suite (run 1)
        run: |
          set -euo pipefail
          cargo test --release -- deterministic --nocapture 2>&1 | tee /tmp/det_run1.txt
          N1=$(grep -c "^test.*ok$" /tmp/det_run1.txt || true)
          echo "deterministic tests passing (run 1): $N1"
          test "$N1" -ge 1
      - name: Clean build cache
        run: cargo clean 2>&1 | tail -3
      - name: Deterministic suite (run 2)
        run: |
          set -euo pipefail
          cargo test --release -- deterministic --nocapture 2>&1 | tee /tmp/det_run2.txt
          N2=$(grep -c "^test.*ok$" /tmp/det_run2.txt || true)
          echo "deterministic tests passing (run 2): $N2"
          test "$N2" -ge 1
      - name: Double-run digest compare
        # The demo pipeline output contains the recipe digest and the stream
        # commitment. Running it twice must produce the same pair: if either
        # value moved between two clean builds of the same source, the
        # pipeline is no longer reproducible.
        run: |
          set -euo pipefail
          cargo run --release --example demo > /tmp/demo_run1.txt
          cargo run --release --example demo > /tmp/demo_run2.txt
          grep -E "recipe digest|stream commit" /tmp/demo_run1.txt > /tmp/pair1.txt
          grep -E "recipe digest|stream commit" /tmp/demo_run2.txt > /tmp/pair2.txt
          cat /tmp/pair1.txt
          if ! diff -u /tmp/pair1.txt /tmp/pair2.txt; then
            echo "FAIL: the pipeline produced different commitments on two runs!"
            exit 1
          fi
          echo "OK: recipe digest and stream commitment are reproducible."

  cross-platform-determinism:
    # CI Expansion item 2: cross-platform determinism matrix.
    #
    # Every OS runs the demo pipeline and uploads the recipe digest plus
    # stream commitment it produced; the compare job then subjects the three
    # platforms' values to byte equality. A divergence would mean a transfer
    # produced on one platform cannot be rebuilt on another, which breaks the
    # core promise of the system.
    name: Cross-Platform Digest (${{ matrix.os }}) (item 2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: seed-core
      - name: Determinism tests (existing suite)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -- deterministic --nocapture 2>&1 | tee det-${{ matrix.os }}.txt
          N=$(grep -c "^test.*ok$" det-${{ matrix.os }}.txt || true)
          echo "Determinism test count (${{ matrix.os }}): $N"
      - name: Produce the pipeline digest
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --example demo > digest-${{ matrix.os }}.txt
          grep -E "recipe digest|stream commit" digest-${{ matrix.os }}.txt > digest-${{ matrix.os }}.hex
          test -s digest-${{ matrix.os }}.hex
          cat digest-${{ matrix.os }}.hex
          # False-green lock: exactly two commitment lines, each 64 hex chars.
          test "$(wc -l < digest-${{ matrix.os }}.hex)" -eq 2
      - name: Upload the digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.hex
          if-no-files-found: error
          retention-days: 30

  pipeline-digest-compare:
    # The complement of item 2: the three platform digests must be byte-equal.
    name: Pipeline Digest Compare (Linux = macOS = Windows)
    needs: cross-platform-determinism
    runs-on: ubuntu-latest
    steps:
      - name: Collect the digest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pipeline-digest-*
          merge-multiple: true
          path: digests
      - name: Byte-equality gate
        shell: bash
        run: |
          set -euo pipefail
          ls -l digests/
          U="digests/digest-ubuntu-latest.hex"
          M="digests/digest-macos-latest.hex"
          W="digests/digest-windows-latest.hex"
          for f in "$U" "$M" "$W"; do
            if [ ! -s "$f" ]; then
              echo "FAIL: missing digest artifact: $f"
              exit 1
            fi
          done
          echo "ubuntu:  $(cat "$U" | tr '\n' ' ')"
          echo "macos:   $(cat "$M" | tr '\n' ' ')"
          echo "windows: $(cat "$W" | tr '\n' ' ')"
          if ! diff -q "$U" "$M" || ! diff -q "$U" "$W"; then
            echo "FAIL: the pipeline digest differs across platforms!"
            echo "A recipe produced on one platform would not rebuild on another."
            exit 1
          fi
          echo "OK: the pipeline digest is BYTE-EQUAL on all three platforms."
